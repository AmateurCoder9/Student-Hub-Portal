  <main>
    <p>Create an account to use StudentHub.</p>
    <form id="registerForm">
      <label for="name">Name</label><br>
      <input id="name" type="text" required><br><br>
      <label for="email">Email</label><br>
      <input id="email" type="email" required><br><br>
      <label for="password">Password</label><br>
      <input id="password" type="password" minlength="6" required><br><br>
      <label for="confirmPassword">Confirm Password</label><br>
      <input id="confirmPassword" type="password" minlength="6" required><br><br>
      <button type="submit">Register</button>
    </form>
    <p id="message"></p>
  </main>
  <script src="register.js"></script>
